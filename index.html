<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WMS Bodega 0A10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Concepto: app de piso para usar con una mano. Cabecera con la ocupación, pestañas fijas abajo.
   El mapa dibuja cada rack en elevación: postes azules, vigas naranjas, nivel 3 arriba y nivel 1 abajo. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#E2E7EC; --line:#C7D0D9;
  --fg:#121C26; --muted:#56636F;
  --accent:#1B4F8F; --accent-fg:#FFFFFF; --accent-soft:#D8E5F4;
  --beam:#D4620A; --beam-ink:#8A3F00; --beam-soft:#FBE4D0; --on-beam:#2A1200;
  --ok:#1B7A4B; --ok-soft:#D6EFE2;
  --bad:#B3261E; --bad-soft:#F8DDDA; --bad-fg:#FFFFFF;
  --font-ui:'Barlow','Segoe UI',system-ui,-apple-system,sans-serif;
  --font-head:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E151C; --surface:#16202A; --surface-2:#1F2C38; --line:#2D3C4A;
    --fg:#E7EDF2; --muted:#9BAAB8;
    --accent:#6BA6EE; --accent-fg:#08131F; --accent-soft:#1B3250;
    --beam:#F08A32; --beam-ink:#FFB877; --beam-soft:#3A2515; --on-beam:#2A1200;
    --ok:#62CF96; --ok-soft:#133323;
    --bad:#FF8F85; --bad-soft:#3D1E1C; --bad-fg:#2A0906;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#16202A; --surface-2:#1F2C38; --line:#2D3C4A;
  --fg:#E7EDF2; --muted:#9BAAB8;
  --accent:#6BA6EE; --accent-fg:#08131F; --accent-soft:#1B3250;
  --beam:#F08A32; --beam-ink:#FFB877; --beam-soft:#3A2515; --on-beam:#2A1200;
  --ok:#62CF96; --ok-soft:#133323;
  --bad:#FF8F85; --bad-soft:#3D1E1C; --bad-fg:#2A0906;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:400 16px/1.4 var(--font-ui);-webkit-text-size-adjust:100%}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 112px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--font-head);margin:0;text-wrap:balance}
h1{font-size:34px;line-height:1;font-weight:700}
h2{font-size:23px;line-height:1.1;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
p{margin:0}
.mono{font-family:var(--font-mono);font-weight:600}
.eyebrow,.lbl{font:600 12px/1.2 var(--font-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}

/* cabecera */
.top{display:grid;gap:10px;padding-bottom:14px}
.top-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
h1 .mono{font-size:30px}
.occ{text-align:right;font-family:var(--font-head)}
.occ b{font-size:36px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.occ span{display:block;font:500 12px var(--font-ui);color:var(--muted)}
.meter{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.top-sub{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.top-sub b{color:var(--fg);font-variant-numeric:tabular-nums}
.top-sub .pend b{color:var(--beam-ink)}

/* avisos */
.note{display:flex;gap:6px 12px;align-items:center;justify-content:space-between;flex-wrap:wrap;width:100%;padding:10px 12px;border-radius:8px;background:var(--accent-soft);border:1px solid transparent;font-size:14px;margin-bottom:10px;text-align:left}
.note.bad{background:var(--bad-soft);border-color:var(--bad)}
.note.ok{background:var(--ok-soft)}
.note.warn{background:var(--beam-soft)}
button.note{cursor:pointer}
.link{background:none;border:0;padding:0 4px;min-height:44px;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* formularios */
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px}
.count{font:700 14px var(--font-mono);background:var(--beam-soft);color:var(--beam-ink);padding:2px 9px;border-radius:6px}
.form{display:grid;gap:16px}
.field{display:grid;gap:6px;min-width:0}
.inp{width:100%;min-width:0;min-height:52px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);font-size:18px}
.inp.mono{font-size:17px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;padding:4px;background:var(--surface-2);border-radius:8px}
.seg button{min-height:46px;border:0;border-radius:6px;background:transparent;font-weight:600;padding:0 4px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;padding:0 16px;border-radius:8px;border:1.5px solid transparent;font-weight:700;font-size:17px}
.btn-primary{background:var(--accent);color:var(--accent-fg)}
.btn-sec{background:var(--surface);border-color:var(--line)}
.btn-bad{background:var(--bad);color:var(--bad-fg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.stack{display:grid;gap:10px}
.gap-top{margin-top:14px}
.err{color:var(--bad);font-weight:600}
.err:empty{display:none}
.fmts{display:flex;flex-wrap:wrap;gap:6px}
.fmts button{min-height:40px;padding:0 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);font:600 14px var(--font-ui)}
.fmts button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.pasterow{display:grid;grid-template-columns:1fr auto;gap:8px}
.scanbox{display:grid;gap:8px;margin-bottom:16px}
.scanbox .note{margin-bottom:0}
code.raw{font:500 13px var(--font-mono);overflow-wrap:anywhere}
.tag.risk{background:var(--bad-soft);color:var(--bad)}
#risks button[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--bad-fg)}
.ptitle{font:700 26px/1.1 var(--font-head);letter-spacing:.01em;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:6px}
details.alt{border:1px solid var(--line);border-radius:8px;padding:0 12px;background:var(--surface)}
details.alt[open]{padding-bottom:12px;display:grid;gap:8px}
details.alt summary{min-height:44px;display:flex;align-items:center;font-weight:600;color:var(--muted);cursor:pointer}
details.alt .scanbox{margin:0}
.filebtn,.filebtn2{position:relative;cursor:pointer}
.filebtn input,.filebtn2 input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.filebtn2{display:inline-flex;align-items:center;justify-self:start;min-height:44px;padding:0 4px;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:8px}
.bigcode{font:600 26px/1.15 var(--font-mono);overflow-wrap:anywhere}

/* listas */
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;text-align:left;width:100%;padding:12px 14px;min-height:68px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.item[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.item .t1{grid-column:1;font:700 17px/1.2 var(--font-ui);overflow-wrap:anywhere}
.item .t2{grid-column:1;font-size:15px;overflow-wrap:anywhere}
.item .t3{grid-column:1;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.item .side{grid-column:2;grid-row:1 / span 3;display:grid;gap:4px;justify-items:end}
.tag{display:inline-block;font:600 12px var(--font-mono);padding:3px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.pend{background:var(--beam-soft);color:var(--beam-ink)}
.tag.ex{background:var(--surface-2);color:var(--muted)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.empty{padding:22px 14px;border:1.5px dashed var(--line);border-radius:8px;color:var(--muted);text-align:center}

/* selector de ubicación */
.grid{display:grid;gap:6px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g7{grid-template-columns:repeat(7,minmax(0,1fr))}
.chip{min-height:48px;padding:4px 2px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);font:600 16px/1.1 var(--font-mono);display:grid;place-items:center;align-content:center;gap:2px}
.chip small{font:500 11px var(--font-ui);color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip[aria-pressed="true"] small{color:inherit}
.chip.busy{background:var(--surface-2);border-style:dashed;color:var(--muted);text-decoration:line-through}
.chip.busy[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--bad-fg)}
.picker{display:grid;gap:16px}
.stat{display:grid;gap:4px;padding:14px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface)}
.stat.ok{border-color:var(--ok);background:var(--ok-soft)}
.stat.bad{border-color:var(--bad);background:var(--bad-soft)}
.stat .st{font-weight:600}
.back{justify-self:start;min-height:44px;padding:0 4px;background:none;border:0;color:var(--accent);font-weight:600}

/* mapa: rack en elevación */
.rk{min-height:52px}
.rk i{display:block;height:3px;width:100%;background:var(--surface-2);border-radius:2px;overflow:hidden}
.rk i b{display:block;height:100%;background:var(--accent)}
.rk[aria-pressed="true"] i{background:rgba(255,255,255,.3)}
.rk[aria-pressed="true"] i b{background:var(--accent-fg)}
.bay{display:grid;gap:6px;margin-top:16px}
.bay-cap{font:700 15px var(--font-head);letter-spacing:.06em;text-transform:uppercase}
.lvl,.pos{display:grid;grid-template-columns:24px 4px repeat(7,minmax(0,1fr)) 4px;gap:4px;align-items:stretch}
.lvl{padding-block:5px;border-bottom:4px solid var(--beam)}
.up{background:var(--accent);border-radius:1px}
.lv{align-self:center;font:600 12px var(--font-mono);color:var(--muted)}
.pos span{text-align:center;font:500 11px var(--font-mono);color:var(--muted)}
.cell{min-height:46px;min-width:0;padding:0;border-radius:5px;border:1.5px dashed var(--line);background:transparent;font:700 17px var(--font-head)}
.cell.occ{background:var(--accent);border:1.5px solid var(--accent);color:var(--accent-fg)}
.cell.conf{background:var(--bad);border:1.5px solid var(--bad);color:var(--bad-fg)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:16px;font-size:13px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:4px;border:1.5px dashed var(--line);font:700 12px var(--font-head)}
.sw.occ{background:var(--accent);border:1.5px solid var(--accent);color:var(--accent-fg)}
.loading{opacity:.5;pointer-events:none}

/* pestañas, hoja, aviso breve */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:4px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.tabs-in{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;width:100%;max-width:560px}
.tab{position:relative;display:grid;justify-items:center;align-content:center;gap:2px;min-height:58px;border:0;border-radius:8px;background:none;color:var(--muted);font:600 12px var(--font-ui);letter-spacing:.05em;text-transform:uppercase}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.badge{position:absolute;top:3px;left:calc(50% + 8px);min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--beam);color:var(--on-beam);font:700 12px/20px var(--font-mono);text-align:center}
.scrim{position:fixed;inset:0;z-index:30;background:rgba(8,14,20,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:90%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;align-content:start}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.x{flex:none;width:44px;height:44px;border:0;border-radius:8px;background:var(--surface-2);font-size:24px;line-height:1}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 16px;margin:0}
.dl dt{font:600 12px/1.6 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dl dd{margin:0;overflow-wrap:anywhere}
.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;max-width:528px;margin-inline:auto;padding:12px 14px;border-radius:8px;background:var(--fg);color:var(--bg);font-weight:600;text-align:center}
.toast.bad{background:var(--bad);color:var(--bad-fg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.login{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:16px}
.login[hidden]{display:none}
.login form{width:100%;max-width:380px;display:grid;gap:14px}
.login h2{font-family:var(--font-head);font-size:30px;margin:0}
</style>
</head>
<body>
<div class="login" id="login" hidden><form id="loginform" novalidate autocomplete="on">
  <div class="eyebrow">Recepción y ubicación</div>
  <h2>Bodega <span class="mono">0A10</span></h2>
  <div class="field"><label class="lbl" for="lg-mail">Correo</label><input class="inp" id="lg-mail" type="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false"></div>
  <div class="field"><label class="lbl" for="lg-pass">Contraseña</label><input class="inp" id="lg-pass" type="password" autocomplete="current-password"></div>
  <p class="err" id="lg-err" role="alert"></p>
  <button class="btn btn-primary" type="submit" id="lg-go">Entrar</button>
</form></div>
<div class="app" id="app" id="app">
  <header class="top">
    <div class="eyebrow">Recepción y ubicación</div>
    <div class="top-row">
      <h1>Bodega <span class="mono">0A10</span></h1>
      <div class="occ"><b id="h-occ">–</b><span>de 420 ocupadas</span></div>
    </div>
    <div class="meter" role="img" aria-label="Ocupación de la bodega"><i id="h-bar"></i></div>
    <div class="top-sub"><span><b id="h-free">–</b> libres</span><span class="pend"><b id="h-pend">–</b> por ubicar</span><button class="link" data-act="logout" type="button" style="margin-left:auto">Salir</button></div>
  </header>
  <div id="banner"></div>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Secciones">
  <div class="tabs-in">
    <button class="tab" data-act="tab" data-v="recibir"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m0 0-4-4m4 4 4-4M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>Recibir</button>
    <button class="tab" data-act="tab" data-v="ubicar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg>Ubicar<span class="badge" id="b-pend" hidden>0</span></button>
    <button class="tab" data-act="tab" data-v="mapa"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Mapa</button>
    <button class="tab" data-act="tab" data-v="buscar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg>Buscar</button>
  </div>
</nav>
<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" hidden></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,setDoc,updateDoc,deleteDoc,query,where,onSnapshot} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyDpe7ErM27_T7_G6JMPtrUJ0T05ZMI51i8",
  authDomain:"wms-8e9f9.firebaseapp.com",
  projectId:"wms-8e9f9",
  storageBucket:"wms-8e9f9.firebasestorage.app",
  messagingSenderId:"664306690338",
  appId:"1:664306690338:web:bb98a36185539af0535d7b"
};
const fbApp=initializeApp(firebaseConfig), fbAuth=getAuth(fbApp), fs=getFirestore(fbApp);
const docRef=path=>doc(fs,path);
const wrapSnap=d=>({id:d.id,data:()=>d.data()});
const FB={
  auth:fbAuth,
  onUser:cb=>onAuthStateChanged(fbAuth,cb),
  login:(m,p)=>signInWithEmailAndPassword(fbAuth,m,p),
  logout:()=>signOut(fbAuth),
  db:{
    doc:path=>{ const r=docRef(path); return {
      get:async()=>{ const x=await getDoc(r); return {exists:x.exists(),id:x.id,data:()=>x.data()}; },
      set:d=>setDoc(r,d), update:d=>updateDoc(r,d), delete:()=>deleteDoc(r) }; },
    collection:name=>({
      where:(f,op,v)=>({ onSnapshot:(ok,bad)=>onSnapshot(query(collection(fs,name),where(f,op,v)),snap=>ok({docs:snap.docs.map(wrapSnap)}),bad) })
    })
  },
  user:{
    id:async()=>userKey(fbAuth.currentUser),
    can:async()=>true,
    profiles:async ids=>{ const me=userKey(fbAuth.currentUser), o={}; ids.forEach(i=>{ o[i]={name:i,isMe:i===me}; }); return o; }
  }
};
function userKey(u){ return u&&u.email?u.email.split('@')[0].toLowerCase():null; }
(function(){
'use strict';

/* Bodega principal: rack 1-10, posición 1-14, nivel 1-3. Código: 0A10-R01-01-01 = bodega-rack-posición-nivel */
const BOD='0A10', RACKS=10, POSS=14, NIVS=3, PER_RACK=POSS*NIVS, TOTAL=RACKS*PER_RACK;
/* Datos principales: nombre del producto y lote. Cantidad en unidades. */
const pname=p=>String((p&&(p.producto||p.material))||'');
const pini=p=>(pname(p).trim().charAt(0)||'?').toUpperCase();
const uni=n=>fmtQ(n)+' un.';
const qty=p=>(!p.cantidad)?'Por contar':esc(uni(p.cantidad)+(p.formato?' × '+p.formato:''));
const FORMATOS=['250 mL','500 mL','1 L','5 L','10 L','20 L','200 L','100 g','250 g','300 g','500 g','1 kg','5 kg','10 kg','25 kg'];
const CATEGORIAS=['Herbicida','Fungicida','Insecticida','Acaricida','Nematicida','Fertilizante','Bioestimulante','Coadyuvante','Otro'];
const RIESGOS=[['inflamable','Inflamable'],['corrosivo','Corrosivo'],['toxico','Tóxico'],['nocivo','Nocivo / irritante'],['oxidante','Oxidante'],['explosivo','Explosivo'],['ambiente','Daña el medio ambiente']];
const rlabel=k=>(RIESGOS.find(r=>r[0]===k)||[k,k])[1];
const riskTags=p=>(Array.isArray(p&&p.riesgos)?p.riesgos:[]).map(k=>' <span class="tag risk">'+esc(rlabel(k))+'</span>').join('');
const plabel=p=>pname(p)+(p&&p.lote?' · lote '+p.lote:'');
function row(act,p){
  const loc=p.estado==='ubicado'&&p.ubicacion;

function riskWarn(p,L){
  if(!L||!L.rack) return '';
  const mine=Array.isArray(p.riesgos)?p.riesgos:[], hits=[];
  byLoc.forEach((arr,code)=>{
    const l=parseLoc(code); if(!l||l.rack!==L.rack) return;
    arr.forEach(o=>{ if(o.id!==p.id&&incompat(mine,Array.isArray(o.riesgos)?o.riesgos:[])) hits.push(o); });
  });
  if(!hits.length) return '';
  const names=[...new Set(hits.map(o=>pname(o)))].slice(0,3).join(', ');
  return '<div class="note warn"><span><b>Revisa la compatibilidad.</b> En el rack '+pad(L.rack)+' hay '+esc(names)+', que puede ser incompatible por sus riesgos. Confirma con la hoja de seguridad (HDS) antes de ubicar aquí.</span></div>';
}

function total(p){
  const m=/^(\d+(?:[.,]\d+)?)\s*(l|lt|lts|litro|litros|ml|cc|cm3|kg|kgs|kilo|kilos|g|gr|grs|gramo|gramos)\.?$/i.exec(String(p.formato||'').trim());
  if(!m) return '';
  const u=m[2].toLowerCase(), liq=/^(l|lt|lts|litro|litros|ml|cc|cm3)$/.test(u);
  const small=/^(ml|cc|cm3|g|gr|grs|gramo|gramos)$/.test(u);
  const base=parseFloat(m[1].replace(',','.'))*(small?0.001:1)*(Number(p.cantidad)||0);
  const nf=new Intl.NumberFormat('es-CL',{maximumFractionDigits:1});
  if(base>0&&base<1) return nf.format(base*1000)+(liq?' mL':' g');
  return nf.format(base)+(liq?' L':' kg');
}

  if(f._auto){

  const hit=n&&S.pallets.filter(p=>pname(p).trim().toLowerCase()===n).sort((a,b)=>(b.ts||0)-(a.ts||0))[0];
  if(hit){

    f._auto=a;

function parseLoc(s){
  const t=String(s||'').toUpperCase().replace(/\s+/g,'');
  const m=/^(?:0A10[-_]?)?R?(\d{1,2})[-./_](\d{1,2})[-./_](\d{1,2})$/.exec(t)||/^(?:0A10[-_]?)?R?(\d{2})(\d{2})(\d{2})$/.exec(t);
  if(!m) return null;
  const r=+m[1], p=+m[2], n=+m[3];
  if(r<1||r>RACKS||p<1||p>POSS||n<1||n>NIVS) return null;
  return {rack:r,pos:p,niv:n,code:mk(r,p,n)};
}
const otraBod=c=>/^0A\d{2}/i.test(String(c||''))&&!/^0A10/i.test(String(c||''));
function genId(){
  const A='23456789ABCDEFGHJKLMNPQRSTUVWXYZ'; let s='PL-';
  const b=new Uint8Array(5);
  if(window.crypto&&crypto.getRandomValues) crypto.getRandomValues(b); else for(let i=0;i<5;i++) b[i]=Math.floor(Math.random()*256);
  for(let i=0;i<5;i++) s+=A[b[i]%32];
  return s;
}
const cleanId=v=>String(v||'').trim().toUpperCase().replace(/[^A-Z0-9_\-.~:@+]/g,'').slice(0,40);
function fmtDT(iso){
  if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return '';
  const now=new Date();
  const day=d.toDateString()===now.toDateString()?'Hoy':(d.toDateString()===new Date(now-864e5).toDateString()?'Ayer':fDay.format(d));
  return day+' '+fTime.format(d);
}
function ago(ms){
  if(!ms) return '';
  const m=Math.max(0,Math.round((Date.now()-ms)/60000));
  if(m<1) return 'ahora'; if(m<60) return 'hace '+m+' min';
  const h=Math.round(m/60); if(h<24) return 'hace '+h+' h';
  return 'hace '+Math.round(h/24)+' d';
}
function msg(e){
  const c=e&&e.code;
  if(c==='dup') return 'Ya existe un pallet con ese ID. Cambia el ID o búscalo en la pestaña Buscar.';
  if(c==='invalid_argument') return 'No se pudo guardar. Revisa que tu acceso permita escribir en esta bodega.';
  if(c==='quota_exceeded') return 'Se llenó el límite de registros de esta bodega. Da de baja pallets antiguos.';
  if(c==='resource_exhausted') return 'Demasiadas operaciones seguidas. Espera unos segundos.';
  if(c==='unavailable') return 'Sin conexión con la bodega. Intenta de nuevo.';
  return 'No se pudo guardar. Intenta de nuevo.';
}

function derive(){
  byLoc=new Map();
  for(const p of S.pallets){
    if(p.estado==='ubicado'&&p.ubicacion){
      const a=byLoc.get(p.ubicacion); if(a) a.push(p); else byLoc.set(p.ubicacion,[p]);
    }
  }
  S.pending=S.pallets.filter(p=>p.estado==='recibido').sort((a,b)=>(a.ts||0)-(b.ts||0));
  S.conflicts=[];
  S.occupied=[...byLoc.keys()].filter(c=>parseLoc(c)).length;
}
const palletById=id=>S.pallets.find(p=>p.id===id);
const takenAt=(code,exceptId)=>(byLoc.get(code)||[]).filter(p=>p.id!==exceptId);
function rackOcc(exceptId){
  const a=new Array(RACKS+1).fill(0);
  byLoc.forEach((arr,c)=>{const l=parseLoc(c); if(l&&arr.some(p=>p.id!==exceptId)) a[l.rack]++;});
  return a;
}
function suggest(p){
  for(let n=1;n<=NIVS;n++) for(let r=1;r<=RACKS;r++) for(let q=1;q<=POSS;q++){
    const c=mk(r,q,n);
    if(c!==p.ubicacion&&!takenAt(c,p.id).length) return {rack:r,pos:q,niv:n};
  }
  return null;
}

/* ---------- stock existente y recomendación ---------- */
const nrm=v=>String(v||'').trim().toLowerCase();
function stockOf(p){
  const n=nrm(pname(p)); if(!n) return [];
  return S.pallets.filter(o=>o.id!==p.id&&o.estado==='ubicado'&&o.ubicacion&&nrm(pname(o))===n);
}
function rackRisk(p,rack){
  const mine=Array.isArray(p.riesgos)?p.riesgos:[]; let bad=false;
  byLoc.forEach((arr,code)=>{ const l=parseLoc(code); if(!l||l.rack!==rack) return;
    arr.forEach(o=>{ if(o.id!==p.id&&incompat(mine,Array.isArray(o.riesgos)?o.riesgos:[])) bad=true; }); });
  return bad;
}
function recommend(p){
  const st=stockOf(p); if(!st.length) return null;
  const lote=String(p.lote||'').trim().toUpperCase();
  const same=lote?st.filter(o=>String(o.lote||'').toUpperCase()===lote):[];
  if(same.length){ const o=same[0]; return {rack:o.rack,pos:o.pos,niv:o.niv,why:'Mismo producto y mismo lote ya está en '+o.ubicacion+': conviene dejarlo junto.'}; }
  for(const o of st){
    if(rackRisk(p,o.rack)) continue;
    for(let n=1;n<=NIVS;n++) if(!takenAt(mk(o.rack,o.pos,n),p.id).length) return {rack:o.rack,pos:o.pos,niv:n,why:'Ya hay lote '+o.lote+' en '+o.ubicacion+': esta ubicación queda en la misma posición.'};
    for(let d=1;d<POSS;d++) for(const q of [o.pos-d,o.pos+d]){
      if(q<1||q>POSS) continue;
      for(let n=1;n<=NIVS;n++) if(!takenAt(mk(o.rack,q,n),p.id).length) return {rack:o.rack,pos:q,niv:n,why:'Ya hay lote '+o.lote+' en '+o.ubicacion+': queda en el mismo rack, al lado.'};
    }
  }
  return null;
}
function stockNote(p){
  const st=stockOf(p); if(!st.length) return '';
  const tot=st.reduce((a,o)=>a+(Number(o.cantidad)||0),0);
  const det=st.slice(0,3).map(o=>'lote '+esc(o.lote)+': '+(o.cantidad?fmtQ(o.cantidad)+' un.':'sin contar')+' en '+esc(o.ubicacion)).join('; ')+(st.length>3?'; y '+(st.length-3)+' más':'');
  const r=recommend(p);
  return '<div class="note"><span><b>Ya hay stock de '+esc(pname(p))+':</b> '+fmtQ(tot)+' un. en '+st.length+(st.length===1?' ubicación':' ubicaciones')+' ('+det+').'
    +(r?' <b>Sugerencia:</b> '+mk(r.rack,r.pos,r.niv)+'. '+esc(r.why)+' Es solo una guía; puedes dejarlo donde prefieras.':'')+'</span></div>';
}

function normTxt(v){ return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(); }
function parseRiesgos(t){
  const out=[]; normTxt(t).split(/[,/|]+/).forEach(w=>{ w=w.trim(); if(!w) return;
    let k=''; if(/^inflam/.test(w)) k='inflamable'; else if(/^corros/.test(w)) k='corrosivo'; else if(/^toxic/.test(w)) k='toxico'; else if(/^(nocivo|irrit)/.test(w)) k='nocivo'; else if(/^oxid/.test(w)) k='oxidante'; else if(/^explos/.test(w)) k='explosivo'; else if(/(ambiente|ecot)/.test(w)) k='ambiente';
    if(k&&out.indexOf(k)<0) out.push(k); });
  return out;
}
async function preGo(){
  if(S.preBusy) return;
  if(S.dbState!=='ok'){ S.preMsg={ok:false,html:'Aún no hay conexión con la bodega.'}; S.preAsk=false; return paintView(); }
  S.preBusy=true; S.preMsg={ok:true,html:'Precargando…'}; paintView();
  const have=new Set(S.pallets.filter(p=>p.precarga&&p.estado==='recibido').map(p=>pname(p).toLowerCase()));
  const names=CATALOGO.filter((n,i,a)=>a.indexOf(n)===i&&!have.has(n.toLowerCase()));
  let okN=0, bad=0; const t0=Date.now();
  for(let i=0;i<names.length;i+=20){
    await Promise.all(names.slice(i,i+20).map(async(n,j)=>{
      try{
        const now=t0+i+j;
        await S.db.doc('pallets/'+genId()).set({estado:'recibido',producto:n,lote:'POR-DEFINIR',categoria:CAT_DE[n.toLowerCase()]||'',riesgos:[],vence:null,gtin:null,formato:'',cantidad:0,unidad:'un',obs:'Precargado: falta contar',ubicacion:null,recibidoPor:S.uid,recibidoEn:new Date(now).toISOString(),ts:now,precarga:true}); okN++;
      }catch(_){ bad++; }
    }));
  }
  S.preBusy=false; S.preAsk=false;
  S.preMsg={ok:!bad,html:'<b>'+okN+' productos precargados.</b>'+(bad?' '+bad+' fallaron, intenta de nuevo.':'')+(names.length===0?' Ya estaban todos.':'')};
  paintView();
}
async function bulkGo(){
  if(S.bulkBusy) return;
  if(S.dbState!=='ok'){ S.bulkMsg={ok:false,html:'Aún no hay conexión con la bodega.'}; return paintView(); }
  const lines=String(S.bulkText||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);
  if(!lines.length){ S.bulkMsg={ok:false,html:'Pega primero la lista.'}; return paintView(); }
  S.bulkBusy=true; S.bulkMsg={ok:true,html:'Cargando '+lines.length+' líneas…'}; paintView();
  let okN=0; const bad=[];
  for(let i=0;i<lines.length;i++){
    const f=lines[i].split(/[;\t]/).map(x=>x.trim());
    const prod=(f[0]||'').replace(/\s+/g,' ');
    let cat=''; const c0=normTxt(f[1]); CATEGORIAS.forEach(c=>{ if(normTxt(c)===c0) cat=c; });
    if(!cat&&f[1]) cat='Otro'; if(!cat&&CAT_DE[normTxt(prod)]) cat=CAT_DE[normTxt(prod)];
    const fmt=(f[2]||'').replace(/\s+/g,' '), cant=Number(String(f[3]||'0').replace(/[.\s]/g,'')), lote=(f[4]||'').toUpperCase()||'POR-DEFINIR';
    const venc=normDate(f[5]||''), ot=String(f[6]||'').toUpperCase().replace(/\s+/g,'-'), isOt=!!f[6]&&otraBod(ot)&&/^[0-9A-Z_\-]{4,20}$/.test(ot), loc=f[6]&&!isOt?parseLoc(f[6]):null, rk=parseRiesgos(f[7]||'');
    let e='';
    if(!prod) e='falta el producto'; else if(!Number.isInteger(cant)||cant<0) e='cantidad no válida'; else if(f[5]&&!venc) e='fecha de vencimiento no válida'; else if(f[6]&&!loc&&!isOt) e='ubicación no válida';
    if(e){ bad.push('Línea '+(i+1)+': '+e); continue; }
    try{
      const now=Date.now()+i, iso=new Date(now).toISOString();
      const d={estado:(loc||isOt)?'ubicado':'recibido',producto:prod,lote:lote,categoria:cat,riesgos:rk,vence:venc||null,gtin:null,formato:fmt,cantidad:cant,unidad:'un',obs:'',ubicacion:loc?loc.code:(isOt?ot:null),recibidoPor:S.uid,recibidoEn:iso,ts:now};
      if(isOt){ d.rack=null; d.pos=null; d.niv=null; d.ubicadoPor=S.uid; d.ubicadoEn=iso; }
      if(!cant){ d.precarga=true; d.obs='Precargado: falta contar'; }
      if(loc){ d.rack=loc.rack; d.pos=loc.pos; d.niv=loc.niv; d.ubicadoPor=S.uid; d.ubicadoEn=iso; }
      await S.db.doc('pallets/'+genId()).set(d); okN++;
    }catch(x){ bad.push('Línea '+(i+1)+': '+msg(x)); }
  }
  S.bulkBusy=false;
  S.bulkMsg={ok:!bad.length,html:'<b>'+okN+' de '+lines.length+' pallets cargados.</b>'+(bad.length?'<br>'+bad.map(esc).join('<br>'):'')};
  if(!bad.length) S.bulkText='';
  paintView();
}
async function submitRecibir(){
  const err=t=>{const el=$('#f-err'); if(el) el.textContent=t||'';};
  err('');
  const f=S.form, id=cleanId(f.id)||genId(), cat=String(f.cat||'').trim(), riesgos=(f.riesgos||[]).slice(), prod=String(f.prod).trim().replace(/\s+/g,' '), lote=String(f.lote).trim().toUpperCase(), fmt=String(f.fmt).trim().replace(/\s+/g,' '), venc=String(f.venc||'').trim(), gtin=String(f.gtin||'').trim();
  const cant=Number(String(f.cant).replace(/[.\s]/g,''));
  if(S.dbState!=='ok') return err('Aún no hay conexión con la bodega. Espera un momento e intenta de nuevo.');
  if(!S.canWrite) return err('Tu acceso es de solo lectura.');
  if(!prod) return err('Falta el nombre del producto.');
  if(!lote) return err('Falta el lote.');
  if(!cat) return err('Elige la categoría del producto.');
  if(!fmt) return err('Falta el formato de la unidad, por ejemplo 1 L.');
  if(!Number.isInteger(cant)||cant<1) return err('La cantidad debe ser un número entero de unidades, mayor que cero.');
  const go=$('#f-go'); if(go) go.disabled=true;

    let id2=id, ref=S.db.doc('pallets/'+id2);

    if((await ref.get()).exists) throw {code:'dup'};
    const now=Date.now();
    await ref.set({estado:'recibido',producto:prod,lote:lote,categoria:cat,riesgos:riesgos,vence:venc||null,gtin:gtin||null,formato:fmt,cantidad:cant,unidad:'un',obs:String(f.obs).trim(),ubicacion:null,recibidoPor:S.uid,recibidoEn:new Date(now).toISOString(),ts:now});
    S.done={id:id2,cat:cat,riesgos:riesgos,prod:prod,lote:lote,fmt:fmt,cant:cant,venc:venc,gtin:gtin}; S.scan=null;
    mount();
  }catch(e){ err(msg(e)); if(go) go.disabled=false; }
}

/* ---------- lector de códigos (foto con la cámara del celular) ---------- */
const fDate=new Intl.DateTimeFormat('es-CL',{day:'2-digit',month:'2-digit',year:'numeric'});
function fmtDate(v){ const d=new Date(v+'T12:00:00'); return isNaN(d)?String(v):fDate.format(d); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function ymd(s){
  const m=/^(\d{2})(\d{2})(\d{2})$/.exec(String(s||'')); if(!m) return '';
  const y=2000+(+m[1]), mo=+m[2]; let d=+m[3];
  if(mo<1||mo>12) return '';
  if(d===0) d=new Date(y,mo,0).getDate();
  return y+'-'+pad(mo)+'-'+pad(d);
}
function normDate(v){
  v=String(v||'').trim(); let m;
  if((m=/^(\d{4})-(\d{2})-(\d{2})/.exec(v))) return m[1]+'-'+m[2]+'-'+m[3];
  if((m=/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/.exec(v))) return m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]);
  if((m=/^(\d{1,2})[\/.\-](\d{4})$/.exec(v))) return m[2]+'-'+pad(+m[1])+'-'+pad(new Date(+m[2],+m[1],0).getDate());
  if(/^20\d{6}$/.test(v)) return v.slice(0,4)+'-'+v.slice(4,6)+'-'+v.slice(6,8);
  if(/^\d{6}$/.test(v)) return ymd(v);
  return '';
}
function parseGS1(t){
  const o={};
  if(/\(\d{2,4}\)/.test(t)){
    const re=/\((\d{2,4})\)([^(]*)/g; let m;
    while((m=re.exec(t))) o[m[1]]=m[2].trim();
    return Object.keys(o).length?o:null;
  }
  const s=t.replace(/^\]\w\d/,''), GS='\x1d';
  const fixed={'00':18,'01':14,'02':14,'11':6,'13':6,'15':6,'17':6};
  const vars=['10','21','30','37','240','241','91','92','93','94','95','96','97','98','99'];
  let i=0;
  while(i<s.length){
    if(s[i]===GS){ i++; continue; }
    const a2=s.substr(i,2), a3=s.substr(i,3);
    if(fixed[a2]){
      const n=fixed[a2], v=s.substr(i+2,n); if(v.length<n) return null;
      o[a2]=v; i+=2+n;
    } else if(vars.indexOf(a3)>=0||vars.indexOf(a2)>=0){
      const ai=vars.indexOf(a3)>=0?a3:a2; let j=s.indexOf(GS,i+ai.length); if(j<0) j=s.length;
      o[ai]=s.slice(i+ai.length,j); i=j;
    } else return null;
  }
  return (o['10']||o['17']||o['01'])?o:null;
}
function parseProduct(text){
  const raw=String(text||'').trim(), out={raw:raw,prod:'',lote:'',venc:'',gtin:''};
  if(!raw) return out;
  const g=parseGS1(raw);
  if(g){ out.gtin=g['01']||''; out.lote=String(g['10']||'').toUpperCase(); out.venc=ymd(g['17']||'')||ymd(g['15']||''); return out; }
  const dl=/\/01\/(\d{8,14})(?:\/10\/([^/?#]+))?/.exec(raw);
  if(dl){
    out.gtin=dl[1]; try{ out.lote=decodeURIComponent(dl[2]||'').toUpperCase(); }catch(_){ out.lote=String(dl[2]||'').toUpperCase(); }
    const q=/[?&]17=(\d{6})/.exec(raw); if(q) out.venc=ymd(q[1]);
    return out;
  }
  let kv={};
  try{ const j=JSON.parse(raw); if(j&&typeof j==='object'&&!Array.isArray(j)) kv=j; }catch(_){}
  if(!Object.keys(kv).length){
    let q=raw; try{ const u=new URL(raw); if(/^https?:$/.test(u.protocol)) q=u.search.slice(1); }catch(_){}
    q.split(/[&;|\n,]+/).forEach(part=>{
      const m=/^\s*([A-Za-zÁÉÍÓÚáéíóúñÑ_ ]+?)\s*[:=]\s*(.+?)\s*$/.exec(part); if(m) kv[m[1]]=m[2];
    });
  }
  const pick=re=>{
    for(const k of Object.keys(kv)){
      if(re.test(k.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim())) return String(kv[k]).trim();
    }
    return '';
  };
  out.prod=pick(/^(producto|product|nombre|name|descripcion|item)$/);
  out.lote=pick(/^(lote|lot|batch|n lote|nro lote|numero de lote)$/).toUpperCase();
  out.venc=normDate(pick(/^(vencimiento|venc|vence|fecha de vencimiento|fecha vencimiento|expiracion|exp|expiry|expiration|fecha)$/));
  out.gtin=pick(/^(gtin|ean|sku|codigo|cod|code)$/);
  return out;
}
function scanBtn(t,label){
  return '<label class="btn btn-sec filebtn">'+esc(label)+'<input type="file" accept="image/*" capture="environment" data-scan="'+t+'" aria-label="'+esc(label)+'"></label>'
    +'<label class="filebtn2">o elegir una foto de la galería<input type="file" accept="image/*" data-scan="'+t+'" aria-label="Elegir una foto de la galería"></label>';
}
function scanNote(){
  const s=S.scan; if(!s) return '';
  return '<div class="note '+(s.tone==='ok'?'ok':'bad')+'"><span>'+s.html+'</span></div>';
}
function handleProdScan(text){
  const p=parseProduct(text);
  if(!(p.lote||p.venc||p.gtin||p.prod)){
    S.scan={tone:'bad',html:'No reconocí el formato de este código. Texto leído: <code class="raw">'+esc(p.raw.slice(0,200))+'</code>'};
    paintView(); return;
  }
  const f=S.form;
  if(p.prod) f.prod=p.prod;
  if(p.lote) f.lote=p.lote;
  if(p.venc) f.venc=p.venc;
  if(p.gtin){
    f.gtin=p.gtin;
    const hit=S.pallets.filter(q=>q.gtin===p.gtin).sort((a,b)=>(b.ts||0)-(a.ts||0))[0];
    if(hit){ if(!p.prod) f.prod=pname(hit); if(hit.formato&&!String(f.fmt).trim()) f.fmt=hit.formato; }
  }
  autoFmt();
  const parts=[];
  if(f.prod) parts.push('producto '+esc(f.prod));
  if(p.lote) parts.push('lote '+esc(p.lote));
  if(p.venc) parts.push('vence '+esc(fmtDate(p.venc)));
  let html='Leído: '+parts.join(' · ')+'.';
  if(!f.prod) html+=' Falta el nombre del producto.'+(p.gtin?' Escríbelo una vez y la próxima vez que escanees este código se completará solo.':'');
  S.scan={tone:'ok',html:html};
  paintView();
}
function handleLocScan(text){
  const l=parseLoc(text);
  if(!l){ toast('No reconocí ese código como ubicación: '+String(text).slice(0,40),'bad',5000); return; }
  S.loc={rack:l.rack,pos:l.pos,niv:l.niv}; S.locText=l.code; paintView(); toast('Ubicación '+l.code);
}
let zxP=null;
function loadZX(){
  if(window.ZXing) return Promise.resolve();
  if(zxP) return zxP;
  zxP=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
    s.onload=res; s.onerror=()=>{ zxP=null; rej(new Error('zxing')); };
    document.head.appendChild(s);
  });
  return zxP;
}
function loadImg(url){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; }); }
async function decodeFile(file){
  const url=URL.createObjectURL(file);
  try{
    if('BarcodeDetector' in window){
      try{
        const img=await loadImg(url);
        const r=await new BarcodeDetector().detect(img);
        if(r&&r.length&&r[0].rawValue) return r[0].rawValue;
      }catch(_){}
    }
    await loadZX();
    const hints=new Map(); hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
    const res=await new ZXing.BrowserMultiFormatReader(hints).decodeFromImageUrl(url);
    return res.getText();
  } finally { URL.revokeObjectURL(url); }
}
document.addEventListener('change',async e=>{
  const inp=e.target;
  if(!inp||!inp.matches||!inp.matches('input[data-scan]')) return;
  const file=inp.files&&inp.files[0], target=inp.dataset.scan; inp.value='';
  if(!file) return;
  toast('Leyendo código…','',25000);
  let text='';
  try{ text=await decodeFile(file); }catch(_){ text=''; }
  $('#toast').hidden=true;
  if(!text){
    const t='No pude leer el código. Acércate, enfoca bien y evita reflejos.';
    if(target==='loc') toast(t,'bad',5000); else { S.scan={tone:'bad',html:esc(t)}; paintView(); }
    return;
  }
  if(target==='loc') handleLocScan(text); else handleProdScan(text);
});

/* ---------- arranque ---------- */
let unsub=null;
function showLogin(on){ const l=document.getElementById('login'); if(l) l.hidden=!on; }
function stop(){ if(unsub){ try{unsub();}catch(_){} unsub=null; } S.db=null; S.user=null; S.uid=null; S.pallets=[]; S.ready=false; S.dbState='connecting'; }
async function start(){
  S.db=FB.db; S.user=FB.user; S.uid=await FB.user.id(); S.canWrite=true; S.dbState='ok'; S.ready=false;
  paintBanner(); paintView();
  unsub=S.db.collection('pallets').where('estado','in',['recibido','ubicado']).onSnapshot(snap=>{
    S.pallets=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
    S.ready=true; derive(); repaint();
  },err=>{
    S.dbState='off'; S.ready=false; paintBanner(); paintHeader();
  });
}
function init(){
  paintHeader(); paintBanner(); mount();
  FB.onUser(u=>{ if(u){ showLogin(false); start(); } else { stop(); showLogin(true); paintBanner(); paintView(); } });
  document.getElementById('loginform').addEventListener('submit',async e=>{
    e.preventDefault();
    const m=document.getElementById('lg-mail').value.trim(), p=document.getElementById('lg-pass').value, er=document.getElementById('lg-err'), go=document.getElementById('lg-go');
    er.textContent=''; if(!m||!p){ er.textContent='Escribe tu correo y tu contraseña.'; return; }
    go.disabled=true;
    try{ await FB.login(m,p); }
    catch(x){ er.textContent=(x&&(x.code==='auth/network-request-failed'))?'Sin internet. Intenta de nuevo.':'Correo o contraseña incorrectos.'; }
    finally{ go.disabled=false; }
  });
}
init();
})();
